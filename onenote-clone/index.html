    // ========================================
    // DRAWING SYSTEM
    // ========================================
    function initDrawingCanvas() {
        const canvas = document.getElementById('drawingCanvas');
        drawCtx = canvas.getContext('2d');
        resizeCanvas();

        // Mouse events
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);

        // Touch events
        canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(touchToMouse(e)); }, { passive: false });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); moveDraw(touchToMouse(e)); }, { passive: false });
        canvas.addEventListener('touchend', e => { e.preventDefault(); endDraw(); }, { passive: false });

        window.addEventListener('resize', resizeCanvas);
    }

    function touchToMouse(e) {
        const touch = e.touches[0];
        const rect = document.getElementById('drawingCanvas').getBoundingClientRect();
        return { offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top };
    }

    function resizeCanvas() {
        const canvas = document.getElementById('drawingCanvas');
        const wrapper = document.getElementById('editorWrapper');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = wrapper.clientWidth * dpr;
        canvas.height = wrapper.clientHeight * dpr;
        canvas.style.width = wrapper.clientWidth + 'px';
        canvas.style.height = wrapper.clientHeight + 'px';
        drawCtx.scale(dpr, dpr);
        if (drawingActive) redrawCanvas();
    }

    function toggleDrawing() {
        drawingActive = !drawingActive;
        const canvas = document.getElementById('drawingCanvas');
        const toolbar = document.getElementById('drawingToolbar');
        const editor = document.getElementById('noteEditor');

        if (drawingActive) {
            canvas.classList.add('active');
            toolbar.classList.add('active');
            editor.contentEditable = 'false';
            resizeCanvas();
            redrawCanvas();
        } else {
            canvas.classList.remove('active');
            toolbar.classList.remove('active');
            editor.contentEditable = 'true';
        }

        // Update ribbon if on draw tab
        const drawTab = document.querySelector('.ribbon-tab[data-tab="draw"]');
        if (drawTab && drawTab.classList.contains('active')) {
            switchRibbonTab('draw');
        }
    }

    function setDrawTool(tool) {
        drawTool = tool;
        document.querySelectorAll('.draw-tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
        document.querySelectorAll(`.draw-tool-btn[data-tool="${tool}"]`).forEach(b => b.classList.add('active'));

        const canvas = document.getElementById('drawingCanvas');
        canvas.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
    }

    function setDrawColor(color) {
        drawColor = color;
        document.querySelectorAll('.draw-color-swatch').forEach(s => {
            s.classList.toggle('active', s.dataset.color === color);
        });
    }

    function startDraw(e) {
        if (!drawingActive) return;
        isDrawing = true;

        const pageId = currentPageId;
        if (!drawPaths[pageId]) drawPaths[pageId] = [];

        if (drawTool === 'eraser') {
            eraseAt(e.offsetX, e.offsetY);
            return;
        }

        currentDrawPath = {
            points: [{ x: e.offsetX, y: e.offsetY }],
            color: drawColor,
            width: drawLineWidth,
            tool: drawTool
        };
    }

    function moveDraw(e) {
        if (!isDrawing || !drawingActive) return;

        if (drawTool === 'eraser') {
            eraseAt(e.offsetX, e.offsetY);
            return;
        }

        if (!currentDrawPath) return;
        currentDrawPath.points.push({ x: e.offsetX, y: e.offsetY });

        // Draw current stroke in real-time
        const pts = currentDrawPath.points;
        const ctx = drawCtx;
        if (pts.length < 2) return;
        ctx.beginPath();
        ctx.strokeStyle = currentDrawPath.tool === 'highlighter' ? hexToRGBA(currentDrawPath.color, 0.3) : currentDrawPath.color;
        ctx.lineWidth = currentDrawPath.tool === 'highlighter' ? currentDrawPath.width * 3 : currentDrawPath.width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const p1 = pts[pts.length - 2];
        const p2 = pts[pts.length - 1];
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
    }

    function endDraw() {
        if (!isDrawing) return;
        isDrawing = false;

        if (currentDrawPath && currentDrawPath.points.length > 1 && drawTool !== 'eraser') {
            const pageId = currentPageId;
            if (!drawPaths[pageId]) drawPaths[pageId] = [];
            drawPaths[pageId].push(currentDrawPath);
            scheduleAutosave();
        }
        currentDrawPath = null;
    }

    function eraseAt(x, y) {
        const pageId = currentPageId;
        if (!drawPaths[pageId]) return;
        const eraseRadius = 15;
        const before = drawPaths[pageId].length;
        drawPaths[pageId] = drawPaths[pageId].filter(path => {
            return !path.points.some(p => Math.hypot(p.x - x, p.y - y) < eraseRadius);
        });
        if (drawPaths[pageId].length !== before) {
            redrawCanvas();
            scheduleAutosave();
        }
    }

    function redrawCanvas() {
        const canvas = document.getElementById('drawingCanvas');
        const dpr = window.devicePixelRatio || 1;
        drawCtx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);

        const pageId = currentPageId;
        const paths = drawPaths[pageId] || [];

        paths.forEach(path => {
            if (path.points.length < 2) return;
            drawCtx.beginPath();
            drawCtx.strokeStyle = path.tool === 'highlighter' ? hexToRGBA(path.color, 0.3) : path.color;
            drawCtx.lineWidth = path.tool === 'highlighter' ? path.width * 3 : path.width;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.moveTo(path.points[0].x, path.points[0].y);
            for (let i = 1; i < path.points.length; i++) {
                drawCtx.lineTo(path.points[i].x, path.points[i].y);
            }
            drawCtx.stroke();
        });
    }

    function clearDrawing() {
        if (!currentPageId) return;
        if (!confirm('Cancellare tutti i disegni di questa pagina?')) return;
        drawPaths[currentPageId] = [];
        redrawCanvas();
        scheduleAutosave();
    }

    function undoLastStroke() {
        const pageId = currentPageId;
        if (!drawPaths[pageId] || drawPaths[pageId].length === 0) return;
        drawPaths[pageId].pop();
        redrawCanvas();
        scheduleAutosave();
    }

    function hexToRGBA(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    }

    }

    function zoomReset() {
        currentZoom = 100;
        applyZoom();
    }

    // imposta lo zoom a un valore preciso (usato dallo slider della status bar)
    function setZoom(value) {
        currentZoom = Math.max(50, Math.min(200, value || 100));
        applyZoom();
    }

    function applyZoom() {
        document.getElementById('noteEditor').style.transform = `scale(${currentZoom/100})`;
        document.getElementById('noteEditor').style.transformOrigin = 'top left';
        document.getElementById('statusZoom').textContent = currentZoom + '%';
        const slider = document.getElementById('statusZoomSlider');
        if (slider && parseInt(slider.value) !== currentZoom) slider.value = currentZoom;
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }

    function duplicateNotebook(nbId) {
        const nb = notebooks.find(n => n.id === nbId);
        if (!nb) return;
        const dup = JSON.parse(JSON.stringify(nb));
        dup.id = generateId();
        dup.name = nb.name + ' (copia)';
        dup.createdAt = new Date().toISOString();
        // Regenerate IDs for sections and pages
        dup.sections.forEach(sec => {
            sec.id = generateId();
            sec.pages.forEach(pg => {
                pg.id = generateId();
            });
        });
        notebooks.push(dup);
        renderNotebooksSidebar();
        saveToStorage();
        showToast('Blocco appunti duplicato');
    }

    function deleteNotebook(nbId) {
        if (notebooks.length <= 1) {
            showToast('Non puoi eliminare l\'ultimo blocco appunti');
            return;
        }
        const nb = notebooks.find(n => n.id === nbId);
        if (!nb) return;
        if (!confirm(`Eliminare "${nb.name}" e tutti i suoi contenuti?`)) return;

        // Clean up drawing paths for all pages in this notebook
        nb.sections.forEach(sec => {
            sec.pages.forEach(pg => {
                delete drawPaths[pg.id];
            });
        });

        notebooks = notebooks.filter(n => n.id !== nbId);
        if (currentNotebookId === nbId) {
            currentNotebookId = notebooks[0].id;
            const newNb = getCurrentNotebook();
            currentSectionId = newNb.sections[0]?.id || null;
            currentPageId = newNb.sections[0]?.pages[0]?.id || null;
        }
        renderNotebooksSidebar();
        renderSections();
        renderPages();
        loadPageIntoEditor();
        saveToStorage();
        showToast('Blocco appunti eliminato');
    }

        const nb = getCurrentNotebook();
        if (!nb) return;

            showToast('Non puoi eliminare l\'ultima sezione');
            return;
        }
        if (!confirm('Eliminare questa sezione e tutte le sue pagine?')) return;
        nb.sections = nb.sections.filter(s => s.id !== secId);
        if (currentSectionId === secId) {
            currentSectionId = nb.sections[0].id;
            currentPageId = nb.sections[0].pages.length > 0 ? nb.sections[0].pages[0].id : null;
        }
        renderSections();
        renderPages();

        let colorsHtml = '<div class="nb-colors-grid">';
        NOTEBOOK_COLORS.forEach(c => {
            colorsHtml += `<span class="nb-color-opt ${c === sec.color ? 'selected' : ''}" style="background:${c}" data-color="${c}" onclick="selectNbColor(this)"></span>`;

    function duplicatePage(pgId) {
        const sec = getCurrentSection();
        if (!sec) return;
        const orig = sec.pages.find(p => p.id === pgId);
        if (!orig) return;
        const dup = {
            ...JSON.parse(JSON.stringify(orig)),
            id: generateId(),
            title: orig.title + ' (copia)',
            createdAt: new Date().toISOString(),
            modifiedAt: new Date().toISOString()
        };
        const idx = sec.pages.findIndex(p => p.id === pgId);
        sec.pages.splice(idx + 1, 0, dup);
        renderPages();
        saveToStorage();
    }

    function movePageToSection(pgId) {
        const nb = getCurrentNotebook();
        if (!nb || nb.sections.length < 2) {
            showToast('Nessuna altra sezione disponibile');
            return;
        }

        let html = '<div style="display:flex;flex-direction:column;gap:6px;">';
        nb.sections.forEach(sec => {
            if (sec.id !== currentSectionId) {
                html += `<button class="btn" onclick="executeMovePage('${pgId}','${sec.id}')" style="text-align:left;">
                    <span class="section-color" style="background:${sec.color};display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;"></span>${sec.name}
                </button>`;
            }
        });
        html += '</div>';
        showModal('Sposta Pagina In...', html);
    }

    function executeMovePage(pgId, targetSecId) {
        closeModalDirect();
        const sec = getCurrentSection();
        const pageIdx = sec.pages.findIndex(p => p.id === pgId);
        if (pageIdx === -1) return;
        const [page] = sec.pages.splice(pageIdx, 1);
        const nb = getCurrentNotebook();
        const targetSec = nb.sections.find(s => s.id === targetSecId);
        if (targetSec) targetSec.pages.push(page);
        if (currentPageId === pgId) {
            currentPageId = sec.pages.length > 0 ? sec.pages[0].id : null;
        }
        renderPages();
        loadPageIntoEditor();
        saveToStorage();
        showToast('Pagina spostata');
    }

    function searchNotes(query) {
        if (!query.trim()) {
            renderPages();
            return;
        }

        const q = query.toLowerCase();
        const results = [];

        notebooks.forEach(nb => {
            nb.sections.forEach(sec => {
                sec.pages.forEach(pg => {
                    const titleMatch = (pg.title || '').toLowerCase().includes(q);
                    const contentMatch = stripHTML(pg.content).toLowerCase().includes(q);
                    if (titleMatch || contentMatch) {
                        results.push({ notebook: nb, section: sec, page: pg });
                    }
                });
            });
        });

        const listEl = document.getElementById('pagesList');
        if (results.length === 0) {
            listEl.innerHTML = '<div style="padding:20px 14px;color:#999;font-size:13px;text-align:center;">Nessun risultato trovato.</div>';
            return;
        }

        let html = '';
        results.forEach(r => {
            html += `<div class="page-item" onclick="navigateToSearchResult('${r.notebook.id}','${r.section.id}','${r.page.id}')">
                <div class="page-item-title">${r.page.title || 'Senza titolo'}</div>
                <div class="page-item-preview" style="color:#7b1fa2;">${r.notebook.name} > ${r.section.name}</div>
            </div>`;
        });
        listEl.innerHTML = html;
    }

    function navigateToSearchResult(nbId, secId, pgId) {
        saveCurrentPageContent();
        currentNotebookId = nbId;
        currentSectionId = secId;
        currentPageId = pgId;
        document.getElementById('globalSearch').value = '';
        renderNotebooksSidebar();
        renderSections();
        renderPages();
        loadPageIntoEditor();
    }

    function saveToLocal() {
        saveCurrentPageContent();
        const data = {
            version: 1,
            exportedAt: new Date().toISOString(),
            notebooks: notebooks,
            drawPaths: drawPaths
        };
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'onenote_backup_' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Backup salvato in locale');
        toggleFilePanel();
    }

    function handleLocalFileLoad(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.notebooks) {
                    notebooks = data.notebooks;
                    if (data.drawPaths) drawPaths = data.drawPaths;
                    currentNotebookId = notebooks[0].id;
                    currentSectionId = notebooks[0].sections[0].id;
                    currentPageId = notebooks[0].sections[0].pages[0]?.id || null;
                    renderNotebooksSidebar();
                    renderSections();
                    renderPages();
                    loadPageIntoEditor();
                    saveToStorage();
                    showToast('Blocchi appunti caricati con successo');
                }
            } catch (err) {
                showToast('Errore nel file: ' + err.message);
            }
        };
        reader.readAsText(file);
        toggleFilePanel();
        e.target.value = '';
    }

    function saveToServer() {
        saveCurrentPageContent();
        const nb = getCurrentNotebook();
        const data = {
            version: 1,
            exportedAt: new Date().toISOString(),
            notebooks: notebooks,
            drawPaths: drawPaths
        };

        const filename = nb.name.replace(/[^a-zA-Z0-9_-]/g, '_');

        fetch('save.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: filename, data: JSON.stringify(data) })
        })
        .then(r => r.json())
        .then(result => {
            if (result.success) {
                showToast('Salvato sul server: ' + result.filename);
                document.getElementById('statusSync').innerHTML = '<i class="fas fa-cloud-check"></i> Server';
            } else {
                showToast('Errore: ' + result.error);
            }
        })
        .catch(err => {
            showToast('Errore di rete: ' + err.message);
        });

        toggleFilePanel();
    }

                result.notebooks.forEach(nb => {

                    html += `<div class="server-doc-item" onclick="loadFromServer('${nb.filename}')" style="padding:8px 16px;">
                        <div class="doc-info">

                            <i class="fas fa-trash"></i>
                        </button>

    }

    function loadFromServer(filename) {
        fetch('load_notebook.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: filename })
        })
        .then(r => r.json())
        .then(result => {
            if (result.success) {
                const data = JSON.parse(result.content);
                if (data.notebooks) {
                    notebooks = data.notebooks;
                    if (data.drawPaths) drawPaths = data.drawPaths;
                    currentNotebookId = notebooks[0].id;
                    currentSectionId = notebooks[0].sections[0].id;
                    currentPageId = notebooks[0].sections[0].pages[0]?.id || null;
                    renderNotebooksSidebar();
                    renderSections();
                    renderPages();
                    loadPageIntoEditor();
                    saveToStorage();
                    showToast('Caricato: ' + filename);
                    document.getElementById('statusSync').innerHTML = '<i class="fas fa-cloud"></i> Server';
                }
            } else {
                showToast('Errore: ' + result.error);
            }
        })
        .catch(err => showToast('Errore di rete: ' + err.message));

        toggleFilePanel();
    }

    function deleteFromServer(filename) {
        if (!confirm('Eliminare "' + filename + '" dal server?')) return;
        fetch('delete_notebook.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: filename })
        })
        .then(r => r.json())
        .then(result => {
            if (result.success) {
                showToast('Eliminato dal server');
                loadFromServerList();
            } else {
                showToast('Errore: ' + result.error);
            }
        })
        .catch(err => showToast('Errore: ' + err.message));
    }

    function exportToPdf(mode) {
        mode = mode || 'download';
        const page = getCurrentPage();
        if (!page) return;
        const container = document.createElement('div');
        container.style.fontFamily = 'Segoe UI, sans-serif';
        container.style.color = '#333';
        container.style.lineHeight = '1.6';
        const title = document.createElement('h1');
        title.style.fontWeight = '300';
        title.style.color = '#7b1fa2';
        title.style.borderBottom = '1px solid #e0e0e0';
        title.style.paddingBottom = '8px';
        title.textContent = page.title || 'Pagina OneNote';
        container.appendChild(title);
        const content = document.createElement('div');
        content.innerHTML = page.content || '';
        container.appendChild(content);
        const filename = (page.title || 'Pagina OneNote') + '.pdf';
        const opt = {
            margin: 10,
            filename: filename,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(container).outputPdf('blob').then(function(pdfBlob) {
            if (mode === 'server') {
                var fd = new FormData();
                fd.append('files', new File([pdfBlob], filename, {type: 'application/pdf'}));
                fd.append('path', 'I miei file');
                fetch('../onedrive-clone/api.php?action=upload', { method: 'POST', body: fd })
                    .then(function(r) { return r.json(); })
                    .then(function(res) {
                        if (res.success) {
                            showToast('PDF salvato su OneDrive!');
                        }
                    })
                    .catch(function() {
                        showToast('Errore: server non disponibile');
                    });
            } else {
                var url = URL.createObjectURL(pdfBlob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                showToast('PDF scaricato!');
            }
        }).catch(function(err) {
            console.error('Errore PDF:', err);
            showToast('Errore esportazione PDF');
        });
        toggleFilePanel();
    }

    function printCurrentPage() {
        const page = getCurrentPage();
        if (!page) return;
        const printHTML = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${page.title || 'Stampa'}</title>
<style>body{font-family:Segoe UI,sans-serif;max-width:100%;padding:20mm;color:#333;line-height:1.6;}
h1{font-weight:300;color:#7b1fa2;}table{border-collapse:collapse;}td,th{border:1px solid #ccc;padding:6px;}</style>
</head><body><h1>${page.title || ''}</h1>${page.content}</body></html>`;

        const blob = new Blob([printHTML], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
        iframe.src = blobUrl;
        iframe.onload = () => {
            iframe.contentWindow.print();
            setTimeout(() => {
                document.body.removeChild(iframe);
                URL.revokeObjectURL(blobUrl);
            }, 1000);
        };
        toggleFilePanel();
    }

    function setupKeyboardShortcuts() {
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch (e.key.toLowerCase()) {
                    case 's':
                        e.preventDefault();
                        saveToStorage();
                        showToast('Salvato');
                        break;
                    case 'e':
                        e.preventDefault();
                        document.getElementById('globalSearch').focus();
                        break;
                    case 'n':
                        if (e.shiftKey) {
                            e.preventDefault();
                            addPage();
                        }
                        break;
                    case 'z':
                        if (e.target.id !== 'noteEditor') {
                            e.preventDefault();
                            undo();
                        }
                        break;
                    case 'y':
                        if (e.target.id !== 'noteEditor') {
                            e.preventDefault();
                            redo();
                        }
                        break;
                    case 'p':
                        e.preventDefault();
                        printCurrentPage();
                        break;
                }
            }
        });
    }

    function stripHTML(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
    }

    function getFileIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        const icons = {
            pdf: 'fa-file-pdf', doc: 'fa-file-word', docx: 'fa-file-word',
            xls: 'fa-file-excel', xlsx: 'fa-file-excel', ppt: 'fa-file-powerpoint',
            pptx: 'fa-file-powerpoint', zip: 'fa-file-archive', rar: 'fa-file-archive',
            jpg: 'fa-file-image', jpeg: 'fa-file-image', png: 'fa-file-image',
            gif: 'fa-file-image', mp3: 'fa-file-audio', wav: 'fa-file-audio',
            mp4: 'fa-file-video', txt: 'fa-file-alt', csv: 'fa-file-csv',
            js: 'fa-file-code', html: 'fa-file-code', css: 'fa-file-code'
        };
        return icons[ext] || 'fa-file';
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function loadSettings() {
        try {
            const s = localStorage.getItem('onenote_settings');
            if (s) {
                Object.assign(appSettings, JSON.parse(s));
            }
            // Migrazione una-tantum: allinea al look di OneNote online (tema bianco)
            if (!localStorage.getItem('onenote_theme_migrated')) {
                appSettings.theme = 'white';
                localStorage.setItem('onenote_theme_migrated', '1');
            }
        } catch(e) {}
        applySettings();
    }

    function saveSettings() {
        localStorage.setItem('onenote_settings', JSON.stringify(appSettings));
    }

    function applySettings() {
        const root = document.documentElement;
        const accent = ACCENT_COLORS[appSettings.accentIndex] || ACCENT_COLORS[0];

        // Set accent colors
        root.style.setProperty('--accent', accent.value);
        root.style.setProperty('--accent-light', accent.light);
        root.style.setProperty('--accent-dark', accent.dark);
        root.style.setProperty('--accent-bg', accent.bg);
        root.style.setProperty('--accent-hover', accent.hover);

        // Theme
        if (appSettings.theme === 'colorful') {
            root.removeAttribute('data-theme');
            root.style.setProperty('--titlebar-bg', accent.value);
            root.style.setProperty('--ribbon-tabs-bg', accent.value);
            root.style.setProperty('--sidebar-bg', accent.dark);
            root.style.setProperty('--statusbar-bg', accent.value);
            root.style.setProperty('--body-bg', '#f3f2f1');
            root.style.setProperty('--panel-bg', '#f9f9f9');
            root.style.setProperty('--panel-border', '#e0e0e0');
            root.style.setProperty('--editor-bg', '#ffffff');
            root.style.setProperty('--editor-text', '#333333');
            root.style.setProperty('--text-primary', '#333333');
            root.style.setProperty('--text-secondary', '#777777');
        } else if (appSettings.theme === 'dark') {
            root.setAttribute('data-theme', 'dark');
            root.style.setProperty('--titlebar-bg', '#1e1e1e');
            root.style.setProperty('--ribbon-tabs-bg', '#1e1e1e');
            root.style.setProperty('--sidebar-bg', '#111111');
            root.style.setProperty('--statusbar-bg', '#1e1e1e');
            root.style.setProperty('--body-bg', '#2d2d2d');
            root.style.setProperty('--panel-bg', '#252525');
            root.style.setProperty('--panel-border', '#3a3a3a');
            root.style.setProperty('--editor-bg', '#1e1e1e');
            root.style.setProperty('--editor-text', '#e0e0e0');
            root.style.setProperty('--text-primary', '#e0e0e0');
            root.style.setProperty('--text-secondary', '#999999');
        } else if (appSettings.theme === 'white') {
            root.setAttribute('data-theme', 'white');
            root.style.setProperty('--titlebar-bg', '#ffffff');
            root.style.setProperty('--ribbon-tabs-bg', '#ffffff');
            root.style.setProperty('--sidebar-bg', '#fafafa');
            root.style.setProperty('--statusbar-bg', '#ffffff');
            root.style.setProperty('--body-bg', '#ffffff');
            root.style.setProperty('--panel-bg', '#fafafa');
            root.style.setProperty('--panel-border', '#e0e0e0');
            root.style.setProperty('--editor-bg', '#ffffff');
            root.style.setProperty('--editor-text', '#333333');
            root.style.setProperty('--text-primary', '#333333');
            root.style.setProperty('--text-secondary', '#777777');
        }

        // Page background
        const editor = document.getElementById('noteEditor');
        if (editor) {
            editor.style.background = appSettings.pageBg;
            // Font
            editor.style.fontFamily = appSettings.editorFont;
            editor.style.fontSize = appSettings.editorFontSize + 'px';
        }

        const editorArea = document.getElementById('editorArea');
        if (editorArea) {
            editorArea.style.background = appSettings.pageBg;
        }

        // Rule lines / grid
        if (editor) {
            editor.classList.toggle('ruled', appSettings.showRuleLines);
            editor.classList.toggle('grid-bg', appSettings.showGrid);
        }

        saveSettings();
    }

    function setEditorBg(mode) {
        appSettings.showRuleLines = (mode === 'ruled');
        appSettings.showGrid = (mode === 'grid');
        applySettings();
        showSettingsModal();

        saveToStorage();
    });
    </script>

    <!-- Auth Modal -->
    <div class="auth-modal-overlay" id="authModal" onclick="if(event.target===this) closeAuthOnenote()">
        <div class="auth-modal">
            <button class="auth-close" onclick="closeAuthOnenote()">&times;</button>
            <div id="auth-container"></div>
        </div>
    </div>

    <style>
        .auth-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 999999;
            align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .auth-modal-overlay.active { display: flex; }
        .auth-modal {
            background: white; border-radius: 16px; padding: 28px;
            max-width: 380px; width: 90%;
            box-shadow: 0 16px 48px rgba(0,0,0,0.2); position: relative;
            animation: authFadeIn 0.25s ease;
        }
        @keyframes authFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .auth-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 22px; color: #aaa; cursor: pointer; padding: 4px; line-height: 1; }
        .auth-close:hover { color: #d32f2f; }
    </style>

    <script>
    let authInitOnenote = false;
    function toggleAuthOnenote() {
        const a = window.CloneOfficeAuth; if (!a) return;
        document.getElementById('authModal').classList.add('active');
        const c = document.getElementById('auth-container');
        a.isAuthenticated() ? a.showUserUI(c) : a.showLoginUI(c);
    }
    function closeAuthOnenote() { document.getElementById('authModal').classList.remove('active'); }
    function initAuthOnenoteFn() {
        if (authInitOnenote) return; authInitOnenote = true;
        const a = window.CloneOfficeAuth; if (!a) return;
        document.getElementById('btn-auth-onenote').onclick = toggleAuthOnenote;
        a.onAuthChange(function(u) {
            const l = document.getElementById('auth-label-onenote');
            if (l) l.textContent = u ? u.name.split(' ')[0] : 'Utente';
            if (u) { hideAuthBlockerOnenote(); hideSessionLimitBlockerOnenote(); }
        });
        a.onSessionLimit(function(d) { showSessionLimitBlockerOnenote(d); });
        a.init().then(function(u) {
            if (u) { const l = document.getElementById('auth-label-onenote'); if (l) l.textContent = u.name.split(' ')[0]; hideAuthBlockerOnenote(); }
            else { showAuthBlockerOnenote(); }
        });
    }
    function showAuthBlockerOnenote() {
        let b = document.getElementById('auth-blocker-onenote');
        if (b) return;
        b = document.createElement('div'); b.id = 'auth-blocker-onenote';
        b.innerHTML = '<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#f0f2f5;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="text-align:center;padding:40px;"><div style="font-size:64px;margin-bottom:20px;">🔐</div><h2 style="font-size:24px;color:#1a1a2e;margin-bottom:8px;">Accesso richiesto</h2><p style="color:#888;font-size:14px;margin-bottom:24px;">Devi effettuare l\'accesso per utilizzare questa applicazione.</p><button onclick="toggleAuthOnenote()" style="padding:12px 32px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">Accedi con QR Code</button><br><br><a href="../index.html" style="color:#e94560;font-size:13px;text-decoration:none;">Torna alla Home</a></div></div>';
        document.body.appendChild(b);
    }
    function hideAuthBlockerOnenote() { const b = document.getElementById('auth-blocker-onenote'); if (b) b.remove(); }
    function showSessionLimitBlockerOnenote(d) {
        let b = document.getElementById('session-limit-blocker-onenote');
        if (b) return;
        b = document.createElement('div'); b.id = 'session-limit-blocker-onenote';
        b.innerHTML = '<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(26,26,46,0.97);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="text-align:center;padding:40px;max-width:420px;"><div style="font-size:64px;margin-bottom:20px;">📵</div><h2 style="font-size:24px;color:#fff;margin-bottom:8px;">Limite dispositivi raggiunto</h2><p style="color:#ccc;font-size:14px;margin-bottom:8px;">Hai '+d.active_sessions+' sessione/i attiva/e su un massimo di '+d.max_devices+' consentiti dalla licenza.</p><p style="color:#999;font-size:12px;margin-bottom:24px;">Per utilizzare questa applicazione su un nuovo dispositivo, disconnetti una sessione esistente o acquista una licenza con pi&ugrave; dispositivi.</p><button onclick="logoutAndCloseOnenote()" style="padding:12px 32px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">Esci e torna alla Home</button></div></div>';
        document.body.appendChild(b);
    }
    function hideSessionLimitBlockerOnenote() { const b = document.getElementById('session-limit-blocker-onenote'); if (b) b.remove(); }
    function logoutAndCloseOnenote() {
        const a = window.CloneOfficeAuth;
        if (a) a.logout().then(function() { window.location.href = "../index.html"; });
        else window.location.href = "../index.html";
    }
    if (document.readyState === 'complete') initAuthOnenoteFn(); else window.addEventListener('load', initAuthOnenoteFn);
    </script>

    <script src="../shared/app-launcher.js"></script>
    <script>OfficeLauncher.init();</script>
</body>
</html>
